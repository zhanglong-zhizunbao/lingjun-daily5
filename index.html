 "环境工程与生态修复 (Environmental Engineering and Ecological Restoration)", "words": [{"word": "bioremediation", "ph": "/ˌbaɪəʊrɪˌmiːdiˈeɪʃn/", "df": "生物修复", "ex": "Bioremediation uses microorganisms to degrade environmental pollutants.", "note": "利用生物体清除污染物的环境修复技术"}, {"word": "phytoremediation", "ph": "/ˌfaɪtəʊrɪˌmiːdiˈeɪʃn/", "df": "植物修复", "ex": "Phytoremediation uses plants to absorb heavy metals from contaminated soil.", "note": "利用植物去除环境中污染物的绿色修复技术"}, {"word": "wastewater treatment", "ph": "/ˈweɪstwɔːtə(r) ˈtriːtmənt/", "df": "污水处理", "ex": "Advanced wastewater treatment removes nutrients and emerging contaminants.", "note": "去除废水中污染物的多级处理过程"}, {"word": "microplastics", "ph": "/ˈmaɪkrəʊˌplæstɪks/", "df": "微塑料", "ex": "Microplastics have been found in oceans, rivers, and even human blood.", "note": "直径小于5毫米的塑料碎片"}, {"word": "air pollution", "ph": "/eə(r) pəˈluːʃn/", "df": "空气污染", "ex": "PM2.5 is the most concerning air pollutant for human health.", "note": "大气中有害物质浓度达到危害程度的污染现象"}]}, {"theme": "航空航天工程 (Aerospace Engineering)", "words": [{"word": "aerodynamics", "ph": "/ˌeərəʊdaɪˈnæmɪks/", "df": "空气动力学", "ex": "Computational fluid dynamics simulates aerodynamic performance.", "note": "研究物体在空气中运动的科学"}, {"word": "propulsion system", "ph": "/prəˈpʌlʃn ˈsɪstəm/", "df": "推进系统", "ex": "The rocket's propulsion system generates thrust for launch.", "note": "产生推动力使飞行器运动的系统"}, {"word": "reentry", "ph": "/riːˈentri/", "df": "再入大气层", "ex": "Reentry vehicles must withstand temperatures exceeding 2000°C.", "note": "航天器从太空返回大气层的过程"}, {"word": "payload fairing", "ph": "/ˈpeɪləʊd ˈfeərɪŋ/", "df": "整流罩", "ex": "The payload fairing protects the satellite during launch.", "note": "火箭顶部的保护罩，保护有效载荷"}, {"word": "thermal protection", "ph": "/ˈθɜːml prəˈtekʃn/", "df": "热防护", "ex": "Thermal protection systems shield spacecraft from extreme heat.", "note": "保护飞行器免受高温损伤的技术"}]}, {"theme": "生物医学工程 (Biomedical Engineering)", "words": [{"word": "biocompatibility", "ph": "/ˌbaɪəʊkəmˌpætəˈbɪləti/", "df": "生物相容性", "ex": "Biocompatibility testing ensures materials do not harm living tissue.", "note": "材料与生物系统相容而不引起有害反应的能力"}, {"word": "tissue engineering", "ph": "/ˈtɪʃuː ˌendʒɪˈnɪərɪŋ/", "df": "组织工程", "ex": "Tissue engineering combines scaffolds, cells, and growth factors.", "note": "利用工程学原理修复或替代人体组织"}, {"word": "scaffold", "ph": "/ˈskæfəʊld/", "df": "支架", "ex": "Biodegradable scaffolds provide temporary support for tissue regeneration.", "note": "用于支持细胞生长和组织形成的三维结构"}, {"word": "implantable device", "ph": "/ɪmˈplɑːntəbl dɪˈvaɪs/", "df": "植入式设备", "ex": "Implantable devices include pacemakers, stents, and neural stimulators.", "note": "植入体内的医疗电子或机械装置"}, {"word": "biosensor", "ph": "/ˈbaɪəʊsensə(r)/", "df": "生物传感器", "ex": "Continuous glucose monitors are the most widely used biosensors.", "note": "将生物识别信号转换为可测量电信号的传感装置"}]}, {"theme": "综合工程前沿 (Frontiers of Engineering — Comprehensive Review)", "words": [{"word": "interdisciplinary", "ph": "/ˌɪntəˈdɪsɪplɪnəri/", "df": "跨学科的", "ex": "Modern engineering challenges require interdisciplinary collaboration.", "note": "跨越多个学科领域的综合方法"}, {"word": "convergence", "ph": "/kənˈvɜːdʒəns/", "df": "汇聚/融合", "ex": "Technological convergence of AI, biotech, and materials is accelerating innovation.", "note": "多种技术或学科趋于融合的趋势"}, {"word": "translational", "ph": "/trænsˈleɪʃənl/", "df": "转化/应用的", "ex": "Translational research bridges the gap between lab discoveries and practical applications.", "note": "将基础研究成果转化为实际应用的"}, {"word": "paradigm shift", "ph": "/ˈpærədaɪm ʃɪft/", "df": "范式转变", "ex": "The AI revolution represents a paradigm shift in engineering methodology.", "note": "根本性的思维和实践模式变革"}, {"word": "resilience", "ph": "/rɪˈzɪliəns/", "df": "韧性/恢复力", "ex": "Engineering resilience ensures systems withstand and recover from disruptions.", "note": "系统抵御和从冲击中恢复的能力"}]}];</script>
<script>
// ===== 数据配置 =====
var BASE_DATE = new Date(2026, 9, 19); // 2026-10-19 起始 主题index 0
var THEMES = window.VOCAB;              // 内嵌题库 daily_vocab.js
var WRONG_KEY = 'lj_wrong_v1';          // localStorage 错题键
var DONE_KEY  = 'lj_done_v1';           // localStorage 今日完成键

// ===== 工具函数 =====
function todayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 基于日历日(UTC归一化)的天数差，避免本地时区毫秒偏移
function dayIndex(d){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function daysBetween(a,b){ return dayIndex(b)-dayIndex(a); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

// 当天主题：以起始日为 index0，每天后移一个主题，30 个循环
function todayThemeInfo(){
  var now = new Date();
  var idx = ((daysBetween(BASE_DATE, now) % THEMES.length)+THEMES.length)%THEMES.length;
  var dayNum = idx+1;
  return { idx:idx, dayNum:dayNum, theme:THEMES[idx], dateKey:todayKey(now) };
}

// 从主题生成题目：例句含词->挖空选词；不含->释义匹配
function buildQuestions(theme, count){
  var words = theme.words.slice(0, count);
  var qs = [];
  words.forEach(function(w){
    var stem = null, qtype;
    var ex = w.ex;
    if (ex && ex.toLowerCase().indexOf(w.word.toLowerCase()) !== -1) {
      qtype = 'fill';
      // 把原词（忽略大小写）挖空
      stem = ex.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), function(){ return '__BLANK__'; });
    } else {
      qtype = 'def';           // 释义匹配：给英文词选释义，或给释义选词
      var mode = Math.random() < 0.5 ? 'word2def' : 'def2word';
      qtype = mode;
    }
    qs.push({ word:w, ex:ex, qtype:qtype, stem:stem });
  });
  return qs;
}

// 生成选项：4个，含正确答案，其余从本主题其他词随机（保证都相近）
function makeOptions(theme, correctIdx, correctWord){
  var pool = theme.words.map(function(w,i){return {word:w.word, ph:w.ph, df:w.df, i:i};})
                .filter(function(x){return x.i!==correctIdx;});
  pool = shuffle(pool);
  var opts = pool.slice(0,3).map(function(x){return {word:x.word, ph:x.ph, df:x.df};});
  opts.push({word:correctWord.word, ph:correctWord.ph, df:correctWord.df});
  return shuffle(opts);
}

// ===== 错题记录管理 ====
function loadWrong(){ try{ return JSON.parse(localStorage.getItem(WRONG_KEY))||{}; }catch(e){ return {}; } }
function saveWrong(w){ localStorage.setItem(WRONG_KEY, JSON.stringify(w)); }
function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY))||{}; }catch(e){ return {}; } }
function saveDone(d){ localStorage.setItem(DONE_KEY, JSON.stringify(d)); }
// 错题 key 格式: "主题idx:indexinwords"
function wrongKey(ti, wi){ return ti+':'+wi; }

// ===== 渲染 =====
var state = { correctSel:{} }; // 每道题的正确答案选项index（用于判定）

function renderReview(){
  var w = loadWrong();
  var now = new Date();
  var nowKey = todayKey(now);
  var due = [];
  for (var k in w){ if (w.hasOwnProperty(k)){
    var parts = k.split(':');
    var ti = parseInt(parts[0]), wi = parseInt(parts[1]);
    var firstWrong = new Date(w[k]);
    var diff = daysBetween(firstWrong, now);
    if (diff >= 7){
      due.push({key:k, ti:ti, wi:wi, firstWrong:w[k], diff:diff});
    }
  }}
  var box = document.getElementById('reviewBox');
  if (due.length === 0){
    box.innerHTML = '<div class="review"><h2>🔁 错题复习</h2><div class="empty">暂无到期错题。今天或这7天内做错的题，7天后会自动到这里重新出现 ⏳</div></div>';
    return;
  }
  var html = '<div class="review"><h2>🔁 错题复习（7天到期 · '+due.length+'题）</h2><div class="cnt">以下题目已经过去7天，重新做一遍巩固：</div><div id="reviewQs"></div>';
  html += '<div class="btnrow"><button class="btn" onclick="submitReview()">提交复习</button></div><div id="reviewResult"></div></div>';
  box.innerHTML = html;
  var rc = document.getElementById('reviewQs');
  rc.innerHTML = '';
  // 渲染每题
  due.forEach(function(d){
    var theme = THEMES[d.ti];
    var wd = theme.words[d.wi];
    var opts = makeOptions(theme, d.wi, wd);
    // 记录正确选项
    var correctIdx = -1;
    for (var i=0;i<opts.length;i++) if (opts[i].word===wd.word) correctIdx=i;
    state['r_'+d.key] = correctIdx;
    var card = document.createElement('div');
    card.className='q'; card.dataset.key=d.key;
    var stem = wd.ex;
    var st = stem ? stem.replace(new RegExp(wd.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),function(){return '<span class="blank">______</span>';})
                   : '<span style="color:#7a4fd0">该词释义：</span>'+wd.df;
    var ohtml = '';
    opts.forEach(function(o,j){
      ohtml += '<button class="opt" data-val="'+o.word+'" onclick="revSel(this,\''+d.key+'\','+j+')"><span class="k">'+String.fromCharCode(65+j)+'</span>'+o.word+' <span style="color:#8a94ab">'+o.df+'</span></button>';
    });
    card.innerHTML = '<div class="qtype">🔁 错题复习 · '+wd.ph+'</div><div class="qstem">'+st+'</div>'+ohtml;
    rc.appendChild(card);
  });
}

function revSel(el, key, j){
  var q = el.closest('.q');
  if (q.classList.contains('locked')) return;
  q.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  el.classList.add('sel');
  q.dataset.sel = j;
}

function submitReview(){
  var w = loadWrong();
  var now = new Date();
  var nowKey = todayKey(now);
  var qs = document.querySelectorAll('#reviewQs .q');
  var score=0, total=qs.length;
  qs.forEach(function(q){
    var key = q.dataset.key;
    var correct = state['r_'+key];
    var sel = q.dataset.sel;
    q.classList.add('locked');
    var optEls = q.querySelectorAll('.opt');
    optEls.forEach(function(o,j){
      if (j===correct) o.classList.add('right');
      else if (String(j)===sel) o.classList.add('wrong');
    });
    // 反馈
    var theme = THEMES[parseInt(key.split(':')[0])];
    var wd = theme.words[parseInt(key.split(':')[1])];
    var fb = document.createElement('div');
    if (String(sel)===String(correct)){ score++; fb.className='fb ok'; fb.innerHTML='<b>✅ 答对</b>'+wd.word+' — '+wd.df;
      // 答对：从错题表删除
      delete w[key];
    } else { fb.className='fb no'; fb.innerHTML='<b>❌ 答错，7天后会再次复习</b>正确：'+wd.word+'（'+wd.df+'）<br>'+(wd.note||'');
      // 答错：重置日期为今天，7天后再来
      w[key] = nowKey;
    }
    q.appendChild(fb);
  });
  saveWrong(w);
  var rr = document.getElementById('reviewResult');
  rr.className='result '+(score===total?'good':'bad');
  rr.innerHTML = '<div class="big">'+score+' / '+total+'</div><div class="txt">'+ (score===total?'🎉 全部巩固完成，错题清理成功！':'仍需巩固 '+ (total-score) +' 题，7天后会自动再来。') +'</div>';
  // 刷新复习区（清空已删除的）
  setTimeout(function(){ renderReview(); }, 1800);
}

// ===== 今日做题渲染 =====
function renderToday(){
  var info = todayThemeInfo();
  state = {};
  document.getElementById('todayInfo').textContent = '今天 '+info.dateKey+' · 第 '+info.dayNum+' 组相近词';
  document.getElementById('dayLabel').textContent = info.theme.theme + '（'+todayKey(new Date())+'）';
  var qs = buildQuestions(info.theme, 5);
  var box = document.getElementById('questions');
  box.innerHTML='';
  qs.forEach(function(q, qi){
    var opts = makeOptions(info.theme, qi, q.word);
    var correctIdx=-1;
    for(var i=0;i<opts.length;i++) if(opts[i].word===q.word.word) correctIdx=i;
    state[qi] = correctIdx;
    var card = document.createElement('div');
    card.className='q'; card.dataset.qi=qi;
    var st;
    if (q.qtype==='fill'){
      st = q.stem.replace('__BLANK__','<span class="blank">______</span>');
    } else {
      st = q.qtype==='def2word' ? '<span style="color:#2c5fd0">选出与释义对应的单词：</span><br>'+q.word.df
                                : '<span style="color:#2c5fd0">选出与「'+q.word.word+'」相符的释义：</span>';
    }
    var ohtml='';
    opts.forEach(function(o,j){
      var disp;
      if (q.qtype==='def2word') disp = o.word+' <span style="color:#8a94ab">'+o.ph+'</span>';
      else if (q.qtype==='word2def') disp = o.df;
      else disp = o.word+' <span style="color:#8a94ab">'+o.df+'</span>';
      ohtml += '<button class="opt" data-val="'+o.word+'" onclick="todaySel(this,'+qi+','+j+')"><span class="k">'+String.fromCharCode(65+j)+'</span>'+disp+'</button>';
    });
    var typeLabel = {'fill':'📝 选词填空','def2word':'🔤 释义→单词','word2def':'📖 单词→释义'}[q.qtype];
    card.innerHTML = '<div class="qtype">'+typeLabel+' · '+q.word.ph+'</div><div class="qstem">'+(st||'')+'</div>'+ohtml;
    box.appendChild(card);
  });
}

function todaySel(el, qi, j){
  var card = el.closest('.q');
  if (card.classList.contains('locked')) return;
  card.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  el.classList.add('sel');
  card.dataset.sel = j;
}

function submit(){
  var info = todayThemeInfo();
  var w = loadWrong();
  var done = loadDone();
  var qs = document.querySelectorAll('#questions .q');
  var score=0, total=qs.length;
  var answered=true;
  qs.forEach(function(q){
    if (q.dataset.sel===undefined) answered=false;
  });
  if(!answered){ alert('请先完成所有 5 道题再提交哦～'); return; }
  var allRight=true;
  qs.forEach(function(q){
    var qi = q.dataset.qi;
    var correct = state[qi];
    var sel = q.dataset.sel;
    q.classList.add('locked');
    q.querySelectorAll('.opt').forEach(function(o,j){
      if (j===correct) o.classList.add('right');
      else if (String(j)===sel) o.classList.add('wrong');
    });
    var theme = info.theme;
    var wd = theme.words[qi];
    var fb = document.createElement('div');
    if (String(sel)===String(correct)){ score++; fb.className='fb ok'; fb.innerHTML='<b>✅ 答对</b>'+wd.word+' — '+wd.df;
      // 若今天曾在错题表，答对可清掉
      var k = wrongKey(info.idx, qi);
      if (w[k]) { delete w[k]; }
    } else { allRight=false; fb.className='fb no'; fb.innerHTML='<b>❌ 答错</b>正确：'+wd.word+'（'+wd.df+'）<br><span style="color:#146a45">辨析：'+(wd.note||'')+'</span> <br>7天后本词会出现在错题复习区。';
      // 记录错题（若已存在则保留原首次日期）
      var k = wrongKey(info.idx, qi);
      if (!w[k]) w[k] = todayKey(new Date());
    }
    q.appendChild(fb);
  });
  saveWrong(w);
  done[info.dateKey] = {score:score, total:total};
  saveDone(done);
  var r = document.getElementById('result');
  r.className='result '+(score===total?'good':'bad');
  var msg = score===total ? '🎉 满分！全部答对，今天的5词已掌握！' : (score>=4?'👍 很不错！只错 '+ (total-score) +' 题，7天后会再复习。':'💪 继续加油，错了 '+ (total-score) +' 题，7天后会再复习巩固。');
  r.innerHTML = '<div class="big">'+score+' / '+total+'</div><div class="txt">'+msg+'</div>';
}

function resetToday(){
  document.getElementById('questions').innerHTML='';
  document.getElementById('result').innerHTML='';
  renderToday();
}

// ===== 启动 =====
renderToday();
renderReview();
</script>
