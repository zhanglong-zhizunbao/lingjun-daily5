<script>window.VOCAB=[{"theme":"重要 / 显著类词汇","words":[{"word":"significant","ph":"/sɪɡˈnɪfɪkənt/","df":"重要的；有意义的","ex":"The clinical trial showed significant improvement in patient outcomes.","note":"强调具有重要意义的、值得关注的，常与 improvement/difference/impact 搭配。比 important 更正式。","ex_cn":"这项临床试验显示患者的治疗效果有显著改善。","why":"表示“重要的、显显著的”，强调有重要意义、值得关注，常与improvement(改善)/outcome(结果)搭配，语气比important更正式；本句讲疗效“明显变好”，故选significant。"},{"word":"substantial","ph":"/səbˈstænʃl/","df":"大量的；实质的","ex":"The company made a substantial investment in R&D.","note":"强调数量/程度大，常修饰 amount/number/investment/funding 等量化词。","ex_cn":"这家公司对研发投入了可观的资金。","why":"表示“大量的、实质的”，侧重数量或程度大，常修饰investment(投资)、amount(数量)等；本句强调投入“数额大”，故选substantial。"},{"word":"considerable","ph":"/kənˈsɪdərəbl/","df":"相当多的；可观的","ex":"Considerable progress has been made in nanotechnology.","note":"强调程度大到值得注意，介于 significant 和 substantial 之间，多修饰 progress/success/effort。","ex_cn":"纳米技术已经取得了相当大的进展。","why":"表示“相当多的、可观的”，程度介于significant与substantial之间，多修饰progress(进展)、success(成果)；本句指进展不小，故选considerable。"},{"word":"remarkable","ph":"/rɪˈmɑːkəbl/","df":"非凡的；引人注目的","ex":"The new material exhibits remarkable strength-to-weight ratio.","note":"强调因出众而引人注目，带褒义，比 significant 程度更强。","ex_cn":"这种新材料展现出非凡的强度重量比。","why":"表示“非凡的、引人注目的”，强调因出众而引人注目，带褒义，程度较strong“更强”；本句褒扬材料性能出色，故选remarkable。"},{"word":"notable","ph":"/ˈnəʊtəbl/","df":"值得注意的；显著的","ex":"The study's most notable finding was the correlation between sleep and cognitive function.","note":"强调值得特别指出/记录，比 significant 语气弱，常用于引出具体结果。","ex_cn":"这项研究最值得注意的发现是睡眠与认知功能之间的关联。","why":"表示“值得注意的、显著的”，强调值得特别指出/记录，语气比significant弱，常引出具体结果(finding)；本句强调“这个发现值得关注”，故选notable。"}]},{"theme":"方法 / 途径类词汇","words":[{"word":"approach","ph":"/əˈprəʊtʃ/","df":"方法；途径","ex":"A multidisciplinary approach is necessary to solve complex engineering problems.","note":"最通用的'方法'，强调处理问题的角度/思路。搭配：approach to (doing) sth。","ex_cn":"解决复杂的工程问题需要多学科的方法。","why":"表示“方法、途径”，最通用，强调处理问题的角度/思路，固定搭配approach to；(doing) sth；本句谈“解决工程问题的总体路子”，故选approach。"},{"word":"methodology","ph":"/ˌmeθəˈdɒlədʒi/","df":"方法论；方法体系","ex":"The research methodology combines quantitative and qualitative analysis.","note":"比 method 更系统，指一整套方法体系。学术论文中常出现在 Methodology 章节。","ex_cn":"该研究方法将定量分析与定性分析结合起来。","why":"表示“方法论、方法体系”，比method更系统，指一整套方法体系，学术论文中常出现在Methodology章节；本句指研究整体方法体系，故选methodology。"},{"word":"technique","ph":"/tekˈniːk/","df":"技术；技巧","ex":"This novel imaging technique enables visualization of cellular activity.","note":"侧重具体操作层面上的技巧/技术，需要专门训练才能掌握。","ex_cn":"这种新型成像技术能实现细胞活动的可视化。","why":"表示“技术、技巧”，侧重具体操作层面的技巧/技术，需专门训练掌握；本句指具体的成像手段，故选technique。"},{"word":"strategy","ph":"/ˈstrætədʒi/","df":"策略；战略","ex":"The company's market entry strategy focused on regulatory-first markets.","note":"强调为实现长期目标而制定的整体策略规划，比 approach 更偏宏观和前瞻。","ex_cn":"该公司的市场进入战略聚焦于“监管优先”的市场。","why":"表示“策略、战略”，强调为实现长期目标而制定的整体规划，比approach更宏观前瞻；本句指公司整体市场布局，故选strategy。"},{"word":"tactic","ph":"/ˈtæktɪk/","df":"战术；具体手段","ex":"Targeted drug delivery is a key tactic in cancer treatment.","note":"比 strategy 更具体/短期，是为实现策略而采取的具体手段。","ex_cn":"靶向给药是癌症治疗中的一项关键手段。","why":"表示“战术、具体手段”，比strategy更具体/短期，是为实现策略采取的具体措施；本句指治病的一项具体招数，故选tactic。"}]},{"theme":"分析 / 评估类词汇","words":[{"word":"analyze","ph":"/ˈænəlaɪz/","df":"分析；分解","ex":"The team analyzed the experimental data using statistical methods.","note":"最通用的'分析'，指将整体分解为部分进行系统研究。强调方法性。","ex_cn":"团队使用统计学方法分析了实验数据。","why":"表示“分析、分解”，最通用的“分析”，将整体拆分为部分系统研究，强调方法性；本句对数据作系统处理，故选analyze。"},{"word":"evaluate","ph":"/ɪˈvæljueɪt/","df":"评估；评价","ex":"The device's performance was evaluated under simulated clinical conditions.","note":"强调判断价值/优劣/效果，通常有明确的标准或指标。","ex_cn":"该设备的性能在模拟临床条件下进行了评估。","why":"表示“评估、评价”，强调判断价值/优劣/效果，通常有明确标准；本句判断设备性能好坏，故选evaluate。"},{"word":"assess","ph":"/əˈses/","df":"评估；评定","ex":"Researchers assessed the toxicity of the new compound.","note":"比 evaluate 更侧重'测定程度/数量/风险'，常用于风险评估。","ex_cn":"研究人员评估了这种新化合物的毒性。","why":"表示“评估、评定”，比evaluate更侧重“测定程度/数量/风险”，常用于风险评估；本句测定毒性大小，故选assess。"},{"word":"examine","ph":"/ɪɡˈzæmɪn/","df":"检查；审视","ex":"The researchers examined the tissue samples under an electron microscope.","note":"强调仔细/近距离地看或检查。","ex_cn":"研究人员在电子显微镜下检查了组织样本。","why":"表示“检查、审视”，强调仔细/近距离地看或检查；本句是在显微下仔细查看样本，故选examine。"},{"word":"quantify","ph":"/ˈkwɒntɪfaɪ/","df":"量化；定量","ex":"It is difficult to quantify the long-term environmental impact.","note":"将抽象概念转化为具体数字。学术写作高频词。","ex_cn":"很难量化这项对环境的长期影响。","why":"表示“量化、定量”，将抽象概念转化为具体数字；本句指把环境影响变成具体数值难，故选quantify。"}]},{"theme":"创新 / 发展类词汇","words":[{"word":"innovate","ph":"/ˈɪnəveɪt/","df":"创新；革新","ex":"Companies must continuously innovate to remain competitive in the medical device market.","note":"强调引入新方法/新思路。比 create 更具突破性。","ex_cn":"要在医疗器械市场保持竞争力，企业必须不断创新。","why":"表示“创新、革新”，强调引入新方法/新思路，比create更具突破性；本句谈企业“持续创新”，故选innovate。"},{"word":"pioneer","ph":"/ˌpaɪəˈnɪə(r)/","df":"开创；倡导","ex":"The hospital pioneered the use of robotic surgery in cardiac procedures.","note":"强调首次做某事，开路先锋的角色。","ex_cn":"这家医院开创了将手术机器人用于心脏手术的先河。","why":"表示“开创、倡导”，强调首次做某事、开路先锋的角色；本句指首创/率先使用机器人手术，故选pioneer。"},{"word":"devise","ph":"/dɪˈvaɪz/","df":"设计；发明","ex":"The team devised a novel approach to targeted drug delivery.","note":"强调经过思考/筹划后设计出，常用于方法/方案/系统。","ex_cn":"团队设计出一种靶向给药的新方法。","why":"表示“设计、发明”，强调经思考/筹划后设计出，常用于方法/方案/系统；本句指想出并设计新方法，故选devise。"},{"word":"revolutionize","ph":"/ˌrevəˈluːʃənaɪz/","df":"彻底变革；革命化","ex":"CRISPR technology has revolutionized genetic engineering.","note":"语气最强，强调带来根本性、颠覆性的变革。","ex_cn":"CRISPR技术彻底变革了基因工程。","why":"表示“彻底变革、革命化”，语气最强，带来根本性、颠覆性改变；本句指基因工程被根本改变，故选revolutionize。"},{"word":"evolve","ph":"/ɪˈvɒlv/","df":"演变；进化","ex":"The device design evolved over several iterations to improve patient comfort.","note":"强调逐渐持续的变化过程。","ex_cn":"该设备的设计经过多次迭代改进，以提升患者舒适度。","why":"表示“演变、进化”，强调逐渐持续的变化过程；本句指设计随迭代慢慢演进，故选evolve。"}]},{"theme":"新材料科技与应用 (New Materials Science and Applications)","words":[{"word":"composite","ph":"/kəmˈpɒzɪt/","df":"复合材料\n复合的","ex":"Carbon fiber composites offer superior strength-to-weight ratios.","note":"多种材料组合而成，性能优于单一材料","ex_cn":"碳纤维复合材料具有优越的强度重量比。","why":"表示“复合材料(复合的)”，由多种材料组合而成，性能优于单一材料；本句指碳纤维这类复合材料，故选composite。"},{"word":"polymer","ph":"/ˈpɒlɪmə(r)/","df":"聚合物","ex":"Polymers are widely used in lightweight structural components.","note":"由重复单体组成的大分子材料","ex_cn":"聚合物广泛用于轻质结构部件。","why":"表示“聚合物”，由重复单体组成的大分子材料；本句指高分子聚合物材料，故选polymer。"},{"word":"alloy","ph":"/ˈælɔɪ/","df":"合金","ex":"Titanium alloys maintain strength at high temperatures.","note":"两种以上金属熔合的固体材料","ex_cn":"钛合金在高温下仍能保持强度。","why":"表示“合金”，两种以上金属熔合而成的固体材料；本句指钛合金这种合金，故选alloy。"},{"word":"ceramic","ph":"/səˈræmɪk/","df":"陶瓷","ex":"Advanced ceramics resist extreme heat and wear.","note":"无机非金属材料，耐高温/硬度高","ex_cn":"先进陶瓷能耐受极端高温和磨损。","why":"表示“陶瓷”，无机非金属材料，耐高温/硬度高；本句讲耐高温耐磨的陶瓷，故选ceramic。"},{"word":"synthesize","ph":"/ˈsɪnθəsaɪz/","df":"合成","ex":"The team synthesized a novel nanocomposite material.","note":"将元素/化合物组合制备新物质","ex_cn":"该团队合成了一种新型纳米复合材料。","why":"表示“合成”，将元素/化合物组合制备出新物质；本句指制备新材料，故选synthesize。"}]},{"theme":"航空航天工程 (Aerospace Engineering and Space Exploration)","words":[{"word":"propulsion","ph":"/prəˈpʌlʃn/","df":"推进；推进力","ex":"Electric propulsion systems are used in satellite station-keeping.","note":"特指产生推力使飞行器运动的系统","ex_cn":"电力推进系统用于卫星的轨道保持。","why":"表示“推进、推进力”，特指产生推力使飞行器运动的系统；本句指卫星的电力推进系统，故选propulsion。"},{"word":"thrust","ph":"/θrʌst/","df":"推力","ex":"The rocket engine generates 500 kN of thrust.","note":"发动机产生的向前推力量化值","ex_cn":"火箭发动机产生500千牛的推力。","why":"表示“推力”，发动机产生的向前推力量化值；本句给出具体推力数值，故选thrust。"},{"word":"aerodynamic","ph":"/ˌeərəʊdaɪˈnæmɪk/","df":"空气动力学的","ex":"The aerodynamic design reduces drag by 15%.","note":"专指与空气流动相关的力学特性","ex_cn":"这种空气动力学设计将阻力降低了15%。","why":"表示“空气动力学的”，专指与空气流动相关的力学特性；本句指减少空气阻力的设计，故选aerodynamic。"},{"word":"launch","ph":"/lɔːntʃ/","df":"发射","ex":"The satellite was launched into geostationary orbit.","note":"火箭/航天器从地面升空的过程","ex_cn":"这颗卫星被发射到地球同步轨道。","why":"表示“发射”，火箭/航天器从地面升空的过程；本句指卫星升空入轨，故选launch。"},{"word":"orbit","ph":"/ˈɔːbɪt/","df":"轨道；绕轨道运行","ex":"The space station orbits Earth at ~400 km altitude.","note":"天体或航天器绕另一天体的运行路径","ex_cn":"空间站在约400公里高度绕地球运行。","why":"表示“轨道、绕轨道运行”，天体/航天器绕另一天体的运行路径；本句指空间站绕地运行，故选orbit。"}]},{"theme":"智慧城市与基础设施 (Smart Cities and Infrastructure)","words":[{"word":"integrated","ph":"/ˈɪntɪɡreɪtɪd/","df":"集成的；综合的","ex":"The integrated traffic system optimizes real-time signal timing.","note":"强调多子系统协同工作","ex_cn":"这种集成化的交通系统能优化实时的信号配时。","why":"表示“集成的、综合的”，强调多子系统协同工作；本句指把各交通子系统整合一体，故选integrated。"},{"word":"smart","ph":"/smɑːt/","df":"智能的","ex":"Smart grid enables two-way communication with consumers.","note":"数字化感知/分析/决策能力","ex_cn":"智能电网能够与用户进行双向通信。","why":"表示“智能的”，具备数字化感知/分析/决策能力；本句指能双向通信的“智能”电网，故选smart。"},{"word":"automated","ph":"/ˈɔːtəmeɪtɪd/","df":"自动化的","ex":"Automated waste collection reduces operational costs.","note":"无需人工干预的自动运行","ex_cn":"自动化垃圾收集降低了运营成本。","why":"表示“自动化的”，无需人工干预的自动运行；本句指自动收集垃圾，故选automated。"},{"word":"digital","ph":"/ˈdɪdʒɪtl/","df":"数字的；数字化的","ex":"Digital twin technology simulates city infrastructure in real time.","note":"基于数字/数据的特征","ex_cn":"数字孪生技术可实时模拟城市基础设施。","why":"表示“数字的、数字化的”，基于数字/数据；本句指数字孪生这一数字化技术，故选digital。"},{"word":"infrastructure","ph":"/ˈɪnfrəstrʌktʃə(r)/","df":"基础设施","ex":"Smart infrastructure integrates sensors and communication networks.","note":"支撑城市运行的基础设施体系","ex_cn":"智能基础设施集成了传感器和通信网络。","why":"表示“基础设施”，支撑城市运行的基础设施体系；本句指城市“地基型”的智能设施，故选infrastructure。"}]},{"theme":"交通工程与高铁 (Transportation Engineering and High-Speed Rail)","words":[{"word":"transportation","ph":"/ˌtrænspɔːˈteɪʃn/","df":"运输；交通","ex":"High-speed rail is a sustainable mode of mass transportation.","note":"泛指人员/货物的运输系统","ex_cn":"高铁是一种可持续的大规模运输方式。","why":"表示“运输、交通”，泛指人员/货物运输系统；本句泛指交通运输，故选transportation。"},{"word":"transit","ph":"/ˈtrænzɪt/","df":"公共交通；中转","ex":"Rapid transit systems reduce urban traffic congestion.","note":"特指城市公共交通运输","ex_cn":"快速公共交通系统缓解了城市交通拥堵。","why":"表示“公共交通、中转”，特指城市公共交通运输；本句指城市快速公交，故选transit。"},{"word":"logistics","ph":"/ləˈdʒɪstɪks/","df":"物流","ex":"Integrated logistics networks enable efficient freight movement.","note":"货物从供应地到需求地的流动管理","ex_cn":"综合物流网络实现了高效的货物运输。","why":"表示“物流”，货物从供应地到需求地的流动管理；本句指货运物流网络，故选logistics。"},{"word":"corridor","ph":"/ˈkɒrɪdɔː(r)/","df":"走廊；通道","ex":"The Beijing-Shanghai high-speed rail corridor carries millions annually.","note":"连接两地的线性交通通道","ex_cn":"京沪高铁走廊每年运送数百万人。","why":"表示“走廊、通道”，连接两地的线性交通通道；本句指高铁线路走廊，故选corridor。"},{"word":"velocity","ph":"/vəˈlɒsəti/","df":"速度","ex":"The train reaches a maximum velocity of 350 km/h.","note":"物理上的速度（常为高速场景）","ex_cn":"该列车最高速度达到每小时350公里。","why":"表示“速度”，物理上常指(高速)速度；本句给出时速数值，故选velocity。"}]},{"theme":"6G通信与网络 (6G Communications and Network Technology)","words":[{"word":"communication","ph":"/kəˌmjuːnɪˈkeɪʃn/","df":"通信","ex":"6G communication aims for terabit-per-second data rates.","note":"信息传输/交换的过程和系统","ex_cn":"6G通信的目标是每秒太比特级的数据速率。","why":"表示“通信”，信息传输/交换的过程和系统；本句指6G这个通信系统，故选communication。"},{"word":"transmit","ph":"/trænzˈmɪt/","df":"传输；发射","ex":"Terahertz waves transmit data at unprecedented speeds.","note":"将信号/数据从一个点发送到另一个点","ex_cn":"太赫兹波能以空前速度传输数据。","why":"表示“传输、发射”，将信号/数据从一点发送到另一点；本句指数据传输，故选transmit。"},{"word":"latency","ph":"/ˈleɪtənsi/","df":"延迟；时延","ex":"Ultra-low latency is critical for real-time applications.","note":"数据从发送到接收的时间差","ex_cn":"超低延迟对实时应用至关重要。","why":"表示“延迟、时延”，数据从发送到接收的时间差；本句强调“低延迟”，故选latency。"},{"word":"modulate","ph":"/ˈmɒdjuleɪt/","df":"调制","ex":"Advanced modulation schemes improve spectral efficiency.","note":"改变载波信号的参数以携带信息","ex_cn":"先进的调制方案提高了频谱效率。","why":"表示“调制”，改变载波信号参数以携带信息；本句指调制技术，故选modulate。"},{"word":"spectrum","ph":"/ˈspektrəm/","df":"频谱","ex":"Millimeter-wave spectrum offers abundant bandwidth for 5G/6G.","note":"电磁波的频率范围","ex_cn":"毫米波频谱为5G/6G提供了充足的带宽。","why":"表示“频谱”，电磁波的频率范围；本句指毫米波频段，故选spectrum。"}]},{"theme":"机器人技术 (Robotics and Autonomous Systems)","words":[{"word":"sensor","ph":"/ˈsensə(r)/","df":"传感器","ex":"Force-torque sensors allow robots to detect physical contact.","note":"检测环境物理量的装置","ex_cn":"力-扭矩传感器让机器人能够检测物理接触。","why":"表示“传感器”，检测环境物理量的装置；本句指让机器人感知力的装置，故选sensor。"},{"word":"actuator","ph":"/ˈæktʃueɪtə(r)/","df":"执行器；作动器","ex":"Precision actuators enable accurate robotic movements.","note":"将电信号转化为物理运动的装置","ex_cn":"精密执行器使机器人动作精准。","why":"表示“执行器、作动器”，将电信号转化为物理运动；本句指驱动运动的装置，故选actuator。"},{"word":"feedback","ph":"/ˈfiːdbæk/","df":"反馈","ex":"Real-time feedback from sensors enables adaptive control.","note":"将输出信号返回输入端形成闭环","ex_cn":"来自传感器的实时反馈可实现自适应控制。","why":"表示“反馈”，将输出信号返回输入端形成闭环；本句指反馈信号驱动控制，故选feedback。"},{"word":"calibration","ph":"/ˌkælɪˈbreɪʃn/","df":"校准","ex":"Regular calibration ensures sensor accuracy.","note":"调整测量系统使其符合标准的过程","ex_cn":"定期校准可确保传感器精度。","why":"表示“校准”，调整测量系统使其符合标准；本句指校准传感器，故选calibration。"},{"word":"manipulator","ph":"/məˈnɪpjuleɪtə(r)/","df":"机械臂；操纵器","ex":"The robotic manipulator has six degrees of freedom.","note":"用于抓取/操作物体的机械装置","ex_cn":"这台机器臂有六个自由度。","why":"表示“机械臂、操纵器”，用于抓取/操作物体的机械装置；本句指机械臂，故选manipulator。"}]},{"theme":"量子计算与信息 (Quantum Computing and Information)","words":[{"word":"quantum","ph":"/ˈkwɒntəm/","df":"量子；量子化的","ex":"Quantum computers leverage superposition and entanglement.","note":"物理量离散化的最小单位","ex_cn":"量子计算机利用叠加和纠缠特性。","why":"表示“量子、量子化的”，物理量离散化的最小单位；本句指量子计算机，故选quantum。"},{"word":"superposition","ph":"/ˌsuːpəpəˈzɪʃn/","df":"叠加态","ex":"A qubit in superposition exists as both 0 and 1 simultaneously.","note":"量子比特可同时处于多种状态","ex_cn":"处于叠加态的量子比特可同时表示为0和1。","why":"表示“叠加态”，量子比特可同时处于多种状态；本句指0和1同时存在的状态，故选superposition。"},{"word":"entanglement","ph":"/ɪnˈtæŋɡlmənt/","df":"纠缠；量子纠缠","ex":"Entanglement allows correlation between distant qubits.","note":"量子粒子间非局域的相关性","ex_cn":"纠缠使得相距遥远的量子比特之间产生关联。","why":"表示“纠缠、量子纠缠”，量子粒子间非局域相关性；本句指远距离量子关联，故选entanglement。"},{"word":"coherence","ph":"/kəʊˈhɪərəns/","df":"相干性","ex":"Maintaining coherence is critical for quantum computation.","note":"量子系统保持量子态的持续时间","ex_cn":"保持相干性对量子计算至关重要。","why":"表示“相干性”，量子系统保持量子态的持续时间；本句指维持量子态的关键性，故选coherence。"},{"word":"qubit","ph":"/ˈkjuːbɪt/","df":"量子比特","ex":"100 qubits can outperform any classical computer.","note":"量子计算的基本信息单元","ex_cn":"100个量子比特的性能可超越任何经典计算机。","why":"表示“量子比特”，量子计算的基本信息单元；本句指量子计算单元qubit，故选qubit。"}]},{"theme":"纳米技术与精密工程 (Nanotechnology and Precision Engineering)","words":[{"word":"nanoscale","ph":"/ˈnænəʊskeɪl/","df":"纳米尺度","ex":"Materials at the nanoscale exhibit unique quantum effects.","note":"1-100纳米范围的尺寸等级","ex_cn":"纳米尺度的材料展现出独特的量子效应。","why":"表示“纳米尺度”，1-100纳米范围的尺寸等级；本句指纳米尺寸下的材料，故选nanoscale。"},{"word":"nanoparticle","ph":"/ˈnænəʊpɑːtɪkl/","df":"纳米颗粒","ex":"Gold nanoparticles are used in targeted drug delivery.","note":"至少一维在1-100nm的颗粒","ex_cn":"金纳米颗粒用于靶向给药。","why":"表示“纳米颗粒”，至少一维在1-100nm的颗粒；本句指靶向给药用的纳米颗粒，故选nanoparticle。"},{"word":"nanowire","ph":"/ˈnænəʊwaɪə(r)/","df":"纳米线","ex":"Silicon nanowires serve as building blocks for transistors.","note":"直径纳米级一维结构","ex_cn":"硅纳米线用作晶体管的构件。","why":"表示“纳米线”，直径纳米级的一维结构；本句指硅纳米线，故选nanowire。"},{"word":"quantum dot","ph":"","df":"量子点","ex":"Quantum dots emit light at specific wavelengths depending on size.","note":"纳米半导体晶体，尺寸可调光学特性","ex_cn":"量子点会随尺寸不同发出特定波长的光。","why":"表示“量子点”，纳米半导体晶体，尺寸可调光学特性；本句指发光波长随尺寸变化的量子点，故选quantum dot。"},{"word":"lithography","ph":"/lɪˈθɒɡrəfi/","df":"光刻","ex":"EUV lithography enables 3nm chip fabrication.","note":"将电路图案转移到晶圆的微纳加工技术","ex_cn":"极紫外光刻技术实现了3纳米芯片的制造。","why":"表示“光刻”，把电路图案转移到晶圆的微纳加工技术；本句指光刻制造芯片，故选lithography。"}]},{"theme":"人工智能与机器学习 (AI and Machine Learning)","words":[{"word":"neural network","ph":"/ˈnjʊərəl ˈnetwɜːk/","df":"神经网络","ex":"Deep neural networks have achieved remarkable performance in image recognition.","note":"模仿生物神经元结构的计算模型，深度学习的核心","ex_cn":"深度神经网络在图像识别上取得了卓越成绩。","why":"表示“神经网络”，模仿生物神经元结构的计算模型，深度学习核心；本句指图像识别的神经网络，故选neural network。"},{"word":"deep learning","ph":"/diːp ˈlɜːnɪŋ/","df":"深度学习","ex":"Deep learning leverages multi-layered neural networks for feature extraction.","note":"使用多层神经网络的机器学习方法","ex_cn":"深度学习利用多层神经网络进行特征提取。","why":"表示“深度学习”，使用多层神经网络的机器学习方法；本句指提取特征的多层网络方法，故选deep learning。"},{"word":"backpropagation","ph":"/ˌbækprɒpəˈɡeɪʃn/","df":"反向传播","ex":"Backpropagation computes gradients for network weight updates.","note":"神经网络训练的核心算法，通过链式法则计算梯度","ex_cn":"反向传播算法计算网络权重更新的梯度。","why":"表示“反向传播”，神经网络训练核心算法，用链式法则算梯度；本句指算权重的梯度，故选backpropagation。"},{"word":"convolution","ph":"/ˌkɒnvəˈluːʃn/","df":"卷积","ex":"Convolutional layers extract spatial features from input data.","note":"CNN的核心操作，擅长处理网格结构数据如图像","ex_cn":"卷积层从输入数据中提取空间特征。","why":"表示“卷积”，CNN核心操作，擅长处理图像等网格数据；本句指提取空间特征的卷积层，故选convolution。"},{"word":"transformer","ph":"/trænsˈfɔːmə(r)/","df":"Transformer模型","ex":"The transformer architecture revolutionized natural language processing.","note":"基于自注意力机制的模型架构，LLM的基础","ex_cn":"Transformer架构彻底改变了自然语言处理。","why":"表示“Transformer模型”，基于自注意力机制的架构，LLM的基础；本句指改变NLP的模型架构，故选transformer。"}]},{"theme":"脑机接口 (Brain-Computer Interfaces)","words":[{"word":"brain-computer interface","ph":"/breɪn kəmˈpjuːtə(r) ˈɪntəfeɪs/","df":"脑机接口","ex":"Brain-computer interfaces enable direct communication between the brain and external devices.","note":"BCI建立人脑与外部设备之间的直接通信通道","ex_cn":"脑机接口使人脑与外部设备直接通信。","why":"表示“脑机接口”，建立人脑与外部设备直接的通信通道；本句指大脑与设备的直连，故选brain-computer interface。"},{"word":"neuroprosthetics","ph":"/ˌnjʊərəʊprɒsˈθetɪks/","df":"神经假体","ex":"Neuroprosthetics restore lost sensory or motor function through neural interfaces.","note":"替代或修复受损神经功能的植入式设备","ex_cn":"神经假体通过神经接口恢复受损的感觉或运动功能。","why":"表示“神经假体”，替代或修复受损神经功能的植入式设备；本句指恢复功能的神经装置，故选neuroprosthetics。"},{"word":"electroencephalography","ph":"/ɪˌlektrəʊenˌsefəˈlɒɡrəfi/","df":"脑电图","ex":"EEG measures electrical activity from the scalp for non-invasive BCI.","note":"非侵入式记录大脑电活动的方法","ex_cn":"脑电图从头皮测量电活动，用于无创脑机接口。","why":"表示“脑电图”，非侵入式记录大脑电活动的方法；本句指头皮测量的脑电图(EEG)，故选electroencephalography。"},{"word":"implant","ph":"/ˈɪmplɑːnt/","df":"植入物","ex":"Neural implants with microelectrode arrays record signals from individual neurons.","note":"植入体内的电子设备","ex_cn":"带微电极阵列的神经植入物能记录单个神经元的信号。","why":"表示“植入物”，植入体内的电子设备；本句指植入大脑记录信号的装置，故选implant。"},{"word":"decoding","ph":"/ˌdiːˈkəʊdɪŋ/","df":"解码","ex":"Neural decoding algorithms translate brain signals into commands.","note":"从神经信号中提取意图信息的过程","ex_cn":"神经解码算法将脑信号转换为指令。","why":"表示“解码”，从神经信号中提取意图信息的过程；本句指把脑信号译成指令，故选decoding。"}]},{"theme":"新能源汽车与电池技术 (New Energy Vehicles and Battery Technology)","words":[{"word":"lithium-ion battery","ph":"/ˈlɪθiəm ˈaɪən ˈbætəri/","df":"锂离子电池","ex":"Lithium-ion batteries power most modern electric vehicles.","note":"目前最主流的电动汽车动力电池技术","ex_cn":"锂离子电池为大多数现代电动汽车提供动力。","why":"表示“锂离子电池”，当前最主流的电动汽车动力电池技术；本句指供电动车的锂电池，故选lithium-ion battery。"},{"word":"solid-state battery","ph":"/ˈsɒlɪd steɪt ˈbætəri/","df":"固态电池","ex":"Solid-state batteries promise higher energy density and improved safety.","note":"使用固态电解质替代液态电解液的下一代电池技术","ex_cn":"固态电池有望带来更高的能量密度和更好的安全性。","why":"表示“固态电池”，用固态电解质替代液态电解液的下代电池技术；本句指能量密度更高的固态电池，故选solid-state battery。"},{"word":"energy density","ph":"/ˈenədʒi ˈdensəti/","df":"能量密度","ex":"Increasing energy density extends the driving range of EVs.","note":"单位重量或体积储存的能量","ex_cn":"提高能量密度可延长电动车的续航里程。","why":"表示“能量密度”，单位重量或体积储存的能量；本句指决定续航的“能量密度”，故选energy density。"},{"word":"thermal runaway","ph":"/ˈθɜːml ˈrʌnəweɪ/","df":"热失控","ex":"Thermal runaway is a critical safety concern in lithium-ion batteries.","note":"电池温度失控升高导致起火或爆炸的现象","ex_cn":"热失控是锂离子电池的一个关键安全隐患。","why":"表示“热失控”，电池温度失控升高导致起火或爆炸的现象；本句指锂电池的安全隐患——热失控，故选thermal runaway。"},{"word":"regenerative braking","ph":"/rɪˈdʒenərətɪv ˈbreɪkɪŋ/","df":"再生制动","ex":"Regenerative braking recovers kinetic energy during deceleration.","note":"将制动能量转化为电能回充电池的技术","ex_cn":"再生制动在减速时回收动能。","why":"表示“再生制动”，把制动能量转化为电能回充电池的技术；本句指减速回收动能的技术，故选regenerative braking。"}]},{"theme":"储能技术 (Energy Storage Technology)","words":[{"word":"electrochemical","ph":"/ɪˌlektrəʊˈkemɪkl/","df":"电化学的","ex":"Electrochemical storage converts electrical energy into chemical energy.","note":"涉及电化学反应的能量转换过程","ex_cn":"电化学储能将电能转化为化学能。","why":"表示“电化学的”，涉及电化学反应的能量转换过程；本句指通过电化学反应储能，故选electrochemical。"},{"word":"pumped hydro","ph":"/pʌmpt ˈhaɪdrəʊ/","df":"抽水蓄能","ex":"Pumped hydro storage accounts for over 90% of global energy storage capacity.","note":"利用高低水位差储存势能的大规模储能方式","ex_cn":"抽水蓄能占全球储能总容量的九成以上。","why":"表示“抽水蓄能”，用高低水位差储存势能的大规模储能方式；本句指占主导的抽水蓄能，故选pumped hydro。"},{"word":"flow battery","ph":"/fləʊ ˈbætəri/","df":"液流电池","ex":"Vanadium flow batteries offer scalable, long-duration energy storage.","note":"电解液储存于外部储罐中、可独立扩容的电池","ex_cn":"钒液流电池提供可扩展、长时长的储能。","why":"表示“液流电池”，电解液存于外部储罐、可独立扩容的电池；本句指可扩展长时储能的液流电池，故选flow battery。"},{"word":"grid-scale","ph":"/ɡrɪd skeɪl/","df":"电网级","ex":"Grid-scale storage balances intermittent renewable energy generation.","note":"能够支持电网运行的大规模储能系统","ex_cn":"电网级储能可平衡间歇性的可再生能源发电。","why":"表示“电网级”，能支持电网运行的大规模储能系统；本句指支撑电网的储能规模，故选grid-scale。"},{"word":"round-trip efficiency","ph":"/raʊnd trɪp ɪˈfɪʃnsi/","df":"往返效率","ex":"Lithium-ion batteries achieve round-trip efficiency above 90%.","note":"存储并释放的能量与输入能量的比率","ex_cn":"锂离子电池的往返效率可达90%以上。","why":"表示“往返效率”，存储并释放的能量/输入能量的比率；本句指储能往返转化效率数值，故选round-trip efficiency。"}]},{"theme":"生物制造与合成生物学 (Synthetic Biology and Biomanufacturing)","words":[{"word":"synthetic biology","ph":"/sɪnˈθetɪk baɪˈɒlədʒi/","df":"合成生物学","ex":"Synthetic biology engineers biological systems for useful applications.","note":"将工程原理应用于生物系统设计的交叉学科","ex_cn":"合成生物学以工程原理设计生物系统并用于实际应用。","why":"表示“合成生物学”，将工程原理应用于生物系统设计的交叉学科；本句指设计生物系统的学科，故选synthetic biology。"},{"word":"gene editing","ph":"/dʒiːn ˈedɪtɪŋ/","df":"基因编辑","ex":"CRISPR-Cas9 has revolutionized gene editing with unprecedented precision.","note":"精确修改生物体DNA序列的技术","ex_cn":"CRISPR-Cas9以前所未有的精度彻底改变了基因编辑。","why":"表示“基因编辑”，精确修改生物体DNA序列的技术；本句指精准改造DNA的技术，故选gene editing。"},{"word":"fermentation","ph":"/ˌfɜːmenˈteɪʃn/","df":"发酵","ex":"Industrial fermentation produces chemicals, fuels, and pharmaceuticals.","note":"利用微生物将底物转化为目标产物的生化过程","ex_cn":"工业发酵可生产化学品、燃料和药品。","why":"表示“发酵”，利用微生物将底物转化为目标产物的生化过程；本句指工业发酵生产，故选fermentation。"},{"word":"bioreactor","ph":"/ˌbaɪəʊriˈæktə(r)/","df":"生物反应器","ex":"Stainless steel bioreactors maintain optimal conditions for cell growth.","note":"为微生物或细胞提供受控生长环境的装置","ex_cn":"不锈钢生物反应器为细胞生长维持最佳条件。","why":"表示“生物反应器”，为微生物/细胞提供受控生长环境的装置；本句指培养细胞的反应器，故选bioreactor。"},{"word":"metabolic engineering","ph":"/ˌmetəˈbɒlɪk ˌendʒɪˈnɪərɪŋ/","df":"代谢工程","ex":"Metabolic engineering optimizes cellular pathways for product synthesis.","note":"改造细胞代谢网络以高效生产目标化合物的技术","ex_cn":"代谢工程优化细胞通路以合成目标产物。","why":"表示“代谢工程”，改造细胞代谢网络以高效生产目标化合物的技术；本句指优化代谢通路，故选metabolic engineering。"}]},{"theme":"量子计算与量子技术 (Quantum Computing and Quantum Technology)","words":[{"word":"qubit","ph":"/ˈkjuːbɪt/","df":"量子比特","ex":"Superconducting qubits are the most widely used platform for quantum computing.","note":"量子计算的基本信息单元","ex_cn":"超导量子比特是目前量子计算最常用的平台。","why":"表示“量子比特”，量子计算的基本信息单元；本句指主流量子计算平台的超导qubit，故选qubit。"},{"word":"superposition","ph":"/ˌsuːpəpəˈzɪʃn/","df":"叠加态","ex":"A qubit in superposition can represent both 0 and 1 simultaneously.","note":"量子系统同时处于多个状态的特性","ex_cn":"叠加态中的量子比特可同时代表0和1。","why":"表示“叠加态”，量子系统同时处于多个状态的特性；本句指同时表示0/1的叠加态，故选superposition。"},{"word":"entanglement","ph":"/ɪnˈtæŋɡlmənt/","df":"纠缠","ex":"Entanglement enables quantum correlations that have no classical counterpart.","note":"量子粒子间非局域的关联特性","ex_cn":"纠缠产生经典系统所不具有的量子关联。","why":"表示“纠缠、量子纠缠”，量子粒子间非局域关联；本句指经典系统没有的量子关联，故选entanglement。"},{"word":"decoherence","ph":"/ˌdiːkəʊˈhɪərəns/","df":"退相干","ex":"Decoherence is the primary obstacle to building practical quantum computers.","note":"量子态与环境相互作用而失去相干性的过程","ex_cn":"退相干是建造实用量子计算机的主要障碍。","why":"表示“退相干”，量子态与环境作用而失去相干性的过程；本句指妨碍量子的退相干，故选decoherence。"},{"word":"quantum gate","ph":"/ˈkwɒntəm ɡeɪt/","df":"量子门","ex":"Quantum gates perform unitary operations on qubits.","note":"量子电路中操控量子比特的基本操作","ex_cn":"量子门对量子比特执行酉操作。","why":"表示“量子门”，量子电路中操控量子比特的基本操作；本句指操控qubit的量子门，故选quantum gate。"}]},{"theme":"氢能与核聚变能源 (Hydrogen Energy and Nuclear Fusion)","words":[{"word":"electrolysis","ph":"/ɪˌlekˈtrɒləsɪs/","df":"电解","ex":"Proton exchange membrane electrolysis produces green hydrogen from water.","note":"利用电能将水分解为氢气和氧气的过程","ex_cn":"质子交换膜电解可从水中制取绿氢。","why":"表示“电解”，用电能将水分解为氢气和氧气；本句指电解水制氢，故选electrolysis。"},{"word":"fuel cell","ph":"/ˈfjuːəl sel/","df":"燃料电池","ex":"Hydrogen fuel cells convert chemical energy directly into electricity.","note":"将氢气和氧气的化学能转化为电能的装置","ex_cn":"氢燃料电池将化学能直接转化为电能。","why":"表示“燃料电池”，把氢氧化学能转化为电能；本句指直接产电的燃料电池，故选fuel cell。"},{"word":"proton exchange membrane","ph":"/ˈprəʊtɒn ɪksˈtʃeɪndʒ ˈmembreɪn/","df":"质子交换膜","ex":"PEM fuel cells operate at low temperatures and high power density.","note":"PEM是燃料电池和电解槽中的核心膜材料","ex_cn":"质子交换膜燃料电池在低温、高功率密度下工作。","why":"表示“质子交换膜”，燃料电池/电解槽核心膜材料(PEM)；本句指PEM燃料电池，故选proton exchange membrane。"},{"word":"plasma","ph":"/ˈplæzmə/","df":"等离子体","ex":"Fusion reactions require confining hydrogen plasma at over 100 million degrees.","note":"物质第四态，由自由电子和离子组成的高温电离气体","ex_cn":"聚变反应需要将氢等离子体约束在超过1亿度。","why":"表示“等离子体”，物质第四态，高温电离气体；本句指聚变所需的氢等离子体，故选plasma。"},{"word":"tokamak","ph":"/ˈtəʊkəmæk/","df":"托卡马克","ex":"ITER is the world's largest tokamak fusion experiment under construction.","note":"利用磁场约束等离子体的环形聚变装置","ex_cn":"国际热核聚变实验堆(ITER)是全球在建的最大托卡马克装置。","why":"表示“托卡马克”，用磁场约束等离子体的环形聚变装置；本句指ITER托卡马克，故选tokamak。"}]},{"theme":"具身智能与人形机器人 (Embodied Intelligence and Humanoid Robots)","words":[{"word":"embodied intelligence","ph":"/ɪmˈbɒdid ɪnˈtelɪdʒəns/","df":"具身智能","ex":"Embodied intelligence integrates AI with physical robotic bodies.","note":"强调智能体通过与物理世界交互来学习和推理的AI范式","ex_cn":"具身智能将人工智能与物理机器人的本体相结合。","why":"表示“具身智能”，强调智能体通过与物理世界交互来学习推理的AI范式；本句指AI+机器身体，故选embodied intelligence。"},{"word":"humanoid","ph":"/ˈhjuːmənɔɪd/","df":"人形机器人","ex":"Humanoid robots are designed to operate in human-centric environments.","note":"具有类人外形和运动能力的机器人","ex_cn":"人形机器人被设计用于在以人为本的环境中工作。","why":"表示“人形机器人”，具有类人外形和运动能力的机器人；本句指能在人类环境工作的人形机器人，故选humanoid。"},{"word":"actuator","ph":"/ˈæktʃueɪtə(r)/","df":"执行器","ex":"High-torque electric actuators enable fluid humanoid motion.","note":"将电信号转化为物理运动的驱动装置","ex_cn":"高扭矩电驱动器使人形机器人动作流畅。","why":"表示“执行器”，把电信号转化为物理运动的驱动装置；本句指产生动作的电驱动，故选actuator。"},{"word":"imitation learning","ph":"/ˌɪmɪˈteɪʃn ˈlɜːnɪŋ/","df":"模仿学习","ex":"Imitation learning allows robots to acquire skills by observing human demonstrations.","note":"从专家示范中学习策略的方法","ex_cn":"模仿学习让机器人通过观察人类示范来习得技能。","why":"表示“模仿学习”，从专家示范中学习策略；本句指观察人类来学习，故选imitation learning。"},{"word":"dexterity","ph":"/dekˈsterəti/","df":"灵巧性","ex":"Robotic dexterity with multi-fingered hands remains a major challenge.\\�机器人多指手的灵巧性仍然是一个重大挑战。","note":"手或机械手精细操作物体的能力","ex_cn":"多指机械手的灵巧操作仍是重大挑战。","why":"表示“灵巧性”，手/机械手精细操作物体的能力；本句指机械手精细操控的“灵巧”，故选dexterity。"}]},{"theme":"6G通信技术 (6G Communication Technology)","words":[{"word":"terahertz","ph":"/ˈterəhɜːts/","df":"太赫兹","ex":"Terahertz frequencies between 0.1-10 THz are key for 6G.","note":"6G将使用的极高频率电磁波","ex_cn":"太赫兹(0.1-10THz)频率是6G的关键频段。","why":"表示“太赫兹”，6G将使用的极高频率电磁波；本句指6G用的太赫兹频段，故选terahertz。"},{"word":"massive MIMO","ph":"/ˈmæsɪv ˈmaɪməʊ/","df":"大规模MIMO","ex":"Massive MIMO uses hundreds of antenna elements for beamforming.","note":"使用大量天线阵列的多输入多输出技术","ex_cn":"大规模MIMO使用数百根天线进行波束赋形。","why":"表示“大规模MIMO”，用大量天线阵列的多输入多输出技术；本句指众多天线的MIMO技术，故选massive MIMO。"},{"word":"reconfigurable intelligent surface","ph":"/riːkənˈfɪɡərəbl ɪnˈtelɪdʒənt ˈsɜːfɪs/","df":"可重构智能表面","ex":"RIS dynamically controls the propagation environment to improve signal coverage.","note":"通过可调超表面主动控制无线传播环境的新技术","ex_cn":"智能可重构表面(RIS)动态调控传播环境以改善信号覆盖。","why":"表示“可重构智能表面”，用可调超表面主动控制无线传播环境；本句指调控信号覆盖的RIS，故选reconfigurable intelligent surface。"},{"word":"network slicing","ph":"/ˈnetwɜːk ˈslaɪsɪŋ/","df":"网络切片","ex":"Network slicing creates isolated virtual networks for different use cases.","note":"在同一物理网络上划分多个逻辑网络的技术","ex_cn":"网络切片为不同应用创建相互隔离的虚拟网络。","why":"表示“网络切片”，在同一物理网络上划分多个逻辑网络；本句指按应用划分隔离网络，故选network slicing。"},{"word":"ultra-reliable low-latency","ph":"/ˈʌltrə rɪˈlaɪəbl ləʊ ˈleɪtənsi/","df":"超可靠低延迟","ex":"URLLC is essential for mission-critical applications like remote surgery.","note":"6G承诺提供微秒级延迟和99.99999%可靠性的通信","ex_cn":"高可靠低延迟(URLLC)对远程手术这类关键任务应用必不可少。","why":"表示“超可靠低延迟”，6G承诺微秒级延迟和高可靠性通信；本句指对远程手术等关键应用的URLLC，故选ultra-reliable low-latency。"}]},{"theme":"低空经济与无人机 (Low-Altitude Economy and UAV)","words":[{"word":"unmanned aerial vehicle","ph":"/ʌnˈmænd ˈeəriəl ˈviːɪkl/","df":"无人机","ex":"UAVs are increasingly used for logistics, surveying, and agriculture.","note":"无人驾驶飞机系统的基础平台","ex_cn":"无人机(UAV)越来越多用于物流、测绘和农业。","why":"表示“无人机”，无人驾驶飞机系统的基础平台；本句指物流/农业用的无人机，故选unmanned aerial vehicle。"},{"word":"eVTOL","ph":"/ˈiː viː tɒl/","df":"电动垂直起降飞行器","ex":"eVTOL aircraft promise urban air mobility with zero emissions.","note":"电动垂直起降飞行器，城市空中交通的核心","ex_cn":"eVTOL飞行器有望实现零排放的城市空中交通。","why":"表示“电动垂直起降飞行器”，城市空中交通的核心；本句指零排放的eVTOL，故选eVTOL。"},{"word":"air traffic management","ph":"/eə(r) ˈtræfɪk ˈmænɪdʒmənt/","df":"空中交通管理","ex":"UTM systems manage low-altitude drone traffic safely and efficiently.","note":"针对低空空域无人机交通的管理系统","ex_cn":"UTM系统安全高效地管理低空无人机交通。","why":"表示“空中交通管理”，针对低空空域无人机交通的管理系统；本句指低空无人机管控(UTM)，故选air traffic management。"},{"word":"autonomous navigation","ph":"/ɔːˈtɒnəməs ˌnævɪˈɡeɪʃn/","df":"自主导航","ex":"Autonomous navigation enables drones to follow optimized flight paths.","note":"无需人工干预的自主飞行规划与控制","ex_cn":"自主导航使无人机能沿优化飞行路径飞行。","why":"表示“自主导航”，无需人工干预的自主飞行规划与控制；本句指无人机自主飞行，故选autonomous navigation。"},{"word":"geofencing","ph":"/ˈdʒiːəʊfensɪŋ/","df":"地理围栏","ex":"Geofencing prevents drones from entering restricted airspace.","note":"通过在虚拟边界创建电子屏障限制飞行区域","ex_cn":"地理围栏防止无人机进入受限空域。","why":"表示“地理围栏”，用虚拟边界电子屏障限制飞行区域；本句指限制无人机入区的技术，故选geofencing。"}]},{"theme":"碳中和与碳捕集 (Carbon Neutrality and CCUS)","words":[{"word":"carbon capture","ph":"/ˈkɑːbən ˈkæptʃə(r)/","df":"碳捕集","ex":"Carbon capture technology removes CO₂ from industrial emission sources.","note":"从排放源或大气中分离和捕集二氧化碳的技术","ex_cn":"碳捕集技术从工业排放源去除二氧化碳。","why":"表示“碳捕集”，从排放源/大气分离捕集二氧化碳；本句指从排放源捕CO2，故选carbon capture。"},{"word":"CCUS","ph":"/siː siː juː es/","df":"碳捕集利用与封存","ex":"CCUS is considered essential for achieving net-zero emissions in heavy industry.","note":"碳捕集、利用与封存的全链条技术体系","ex_cn":"碳捕集利用与封存(CCUS)被认为对重工业净零排放至关重要。","why":"表示“碳捕集利用与封存”，碳捕集/利用/封存全链条技术体系；本句指实现净零的CCUS体系，故选CCUS。"},{"word":"sequestration","ph":"/ˌsiːkwəˈstreɪʃn/","df":"封存","ex":"Geological sequestration stores CO₂ in deep underground formations.","note":"将捕集的CO₂长期储存于地下地质结构中","ex_cn":"地质封存将CO₂储存到深层地下构造中。","why":"表示“封存”，把捕集的CO₂长期储存于地下地质结构；本句指把CO2封存地下，故选sequestration。"},{"word":"net-zero","ph":"/net ˈzɪərəʊ/","df":"净零排放","ex":"China aims to achieve carbon neutrality by 2060 and net-zero emissions.","note":"温室气体排放量与清除量达到平衡的状态","ex_cn":"中国力争到2060年实现碳中和与净零排放。","why":"表示“净零排放”，温室气体排放量与清除量平衡的状态；本句指宏观的净零目标，故选net-zero。"},{"word":"carbon footprint","ph":"/ˈkɑːbən ˈfʊtprɪnt/","df":"碳足迹","ex":"Lifecycle assessment measures the total carbon footprint of a product.","note":"产品/活动在整个生命周期中产生的碳排放总量","ex_cn":"生命周期评估衡量产品的总碳足迹。","why":"表示“碳足迹”，产品或活动全生命周期的碳排放总量；本句指测产品碳足迹，故选carbon footprint。"}]},{"theme":"智慧水利与海洋工程 (Smart Water Resources and Ocean Engineering)","words":[{"word":"hydrology","ph":"/haɪˈdrɒlədʒi/","df":"水文学","ex":"Hydrological modeling predicts river flows and flood risks.","note":"研究水循环及其分布的科学","ex_cn":"水文模型可预测河流流量和洪水风险。","why":"表示“水文学”，研究水循环及其分布的科学；本句指水的建模预测，故选hydrology。"},{"word":"desalination","ph":"/ˌdiːsælɪˈneɪʃn/","df":"海水淡化","ex":"Reverse osmosis desalination provides fresh water from seawater.","note":"去除海水中盐分以生产淡水的技术","ex_cn":"反渗透海水淡化可从海水中制取淡水。","why":"表示“海水淡化”，去除海水中盐分以生产淡水；本句指海水制淡水，故选desalination。"},{"word":"subsea","ph":"/ˌsʌbˈsiː/","df":"海底/水下","ex":"Subsea engineering enables oil and gas production on the seafloor.","note":"涉及海底或水下的工程技术","ex_cn":"海底工程使石油天然气能在海床上开采。","why":"表示“海底/水下”，指海底环境，区别于近岸；本句指海床上进行生产，故选subsea。"},{"word":"offshore","ph":"/ˌɒfˈʃɔː(r)/","df":"离岸/海上","ex":"Offshore wind farms generate renewable energy in marine environments.","note":"位于海岸线以外的海洋环境中的工程设施","ex_cn":"海上风电场在海洋环境中产生可再生能源。","why":"表示“海上(近海)”，位于离岸海洋环境；本句指海上风电，故选offshore。"},{"word":"autonomous underwater vehicle","ph":"/ɔːˈtɒnəməs ˌʌndəˈwɔːtə(r) ˈviːɪkl/","df":"自主水下航行器","ex":"AUVs map the seafloor and inspect underwater infrastructure.","note":"无需人工操控的自主水下机器人","ex_cn":"自主水下航行器(AUV)测绘海底并巡检水下设施。","why":"表示“自主水下航行器”，无需人工操控的自主水下机器人；本句指自主下水的AUV，故选autonomous underwater vehicle。"}]},{"theme":"先进制造与工业4.0 (Advanced Manufacturing and Industry 4.0)","words":[{"word":"additive manufacturing","ph":"/ˈædətɪv ˌmænjuˈfæktʃərɪŋ/","df":"增材制造","ex":"Additive manufacturing builds parts layer by layer from digital models.","note":"3D打印的技术术语，与传统减材制造相对","ex_cn":"增材制造根据数字模型逐层构建零件。","why":"表示“增材制造”，3D打印术语，与减材制造相对；本句指逐层构建，故选additive manufacturing。"},{"word":"digital twin","ph":"/ˈdɪdʒɪtl twɪn/","df":"数字孪生","ex":"Digital twins simulate production lines to optimize manufacturing processes.","note":"物理系统的虚拟镜像，用于仿真和优化","ex_cn":"数字孪生模拟生产线以优化制造流程。","why":"表示“数字孪生”，物理系统的虚拟镜像，用于仿真优化；本句指虚拟镜像产线，故选digital twin。"},{"word":"cyber-physical system","ph":"/ˈsaɪbə(r) ˈfɪzɪkl ˈsɪstəm/","df":"信息物理系统","ex":"CPS integrates computation, networking, and physical processes.","note":"计算与物理过程深度融合的系统","ex_cn":"信息物理系统(CPS)集成了计算、网络与物理过程。","why":"表示“信息物理系统”，计算与物理过程深度融合的系统；本句指集成算/网/物理的CPS，故选cyber-physical system。"},{"word":"industrial IoT","ph":"/ɪnˈdʌstriəl aɪ əʊ tiː/","df":"工业物联网","ex":"IIoT connects machines and sensors for real-time production monitoring.","note":"制造业中互联传感器和设备的网络","ex_cn":"工业物联网(IIoT)连接设备与传感器，用于实时生产监控。","why":"表示“工业物联网”，制造业中互联传感器和设备的网络；本句指制造监控的IIoT，故选industrial IoT。"},{"word":"computer numerical control","ph":"/kəmˈpjuːtə(r) njuːˈmerɪkl kənˈtrəʊl/","df":"计算机数控","ex":"CNC machines execute precision machining with micron-level accuracy.","note":"通过计算机程序控制机床的自动化加工技术","ex_cn":"数控(CNC)机床以微米级精度执行精密加工。","why":"表示“计算机数控”，通过计算机程序控制机床的自动化加工技术；本句指CNC机床精密加工，故选computer numerical control。"}]},{"theme":"集成电路与芯片技术 (Integrated Circuits and Chip Technology)","words":[{"word":"semiconductor","ph":"/ˌsemikənˈdʌktə(r)/","df":"半导体","ex":"Silicon is the most widely used semiconductor material.","note":"导电性介于导体和绝缘体之间的材料","ex_cn":"硅是使用最广泛的半导体材料。","why":"表示“半导体”，导电性介于导体和绝缘体之间；本句指硅这种半导体，故选semiconductor。"},{"word":"lithography","ph":"/lɪˈθɒɡrəfi/","df":"光刻","ex":"EUV lithography enables patterning at 3-nanometer node.","note":"在晶圆上转移电路图案的核心工艺","ex_cn":"极紫外光刻实现3纳米节点的图案化。","why":"表示“光刻”，在晶圆上转移电路图案的核心工艺；本句指在晶圆上刻图案，故选lithography。"},{"word":"wafer","ph":"/ˈweɪfə(r)/","df":"晶圆","ex":"A 300mm silicon wafer can yield hundreds of processor chips.","note":"用于制造集成电路的薄圆形半导体基片","ex_cn":"一片300毫米的硅晶圆可产出数百颗处理器芯片。","why":"表示“晶圆”，用于制造集成电路的薄圆形半导体基片；本句指硅晶圆，故选wafer。"},{"word":"transistor density","ph":"/trænˈzɪstə ˈdensəti/","df":"晶体管密度","ex":"Higher transistor density enables more powerful processors.","note":"单位面积集成的晶体管数量","ex_cn":"更高的晶体管密度带来更强大的处理器。","why":"表示“晶体管密度”，单位面积集成的晶体管数量；本句指单位面积密集度，故选transistor density。"},{"word":"die","ph":"/daɪ/","df":"芯片裸片","ex":"Each wafer is diced into individual dies for packaging.","note":"从晶圆上切割下来的单个集成电路芯片","ex_cn":"每片晶圆被切割成独立芯片(die)以待封装。","why":"表示“芯片裸片”，从晶圆切下的单个集成电路芯片；本句指切出的die，故选die。"}]},{"theme":"环境工程与生态修复 (Environmental Engineering and Ecological Restoration)","words":[{"word":"bioremediation","ph":"/ˌbaɪəʊrɪˌmiːdiˈeɪʃn/","df":"生物修复","ex":"Bioremediation uses microorganisms to degrade environmental pollutants.","note":"利用生物体清除污染物的环境修复技术","ex_cn":"生物修复利用微生物降解环境污染物。","why":"表示“生物修复”，利用生物体清除污染物的环境修复技术；本句指用微生物净化，故选bioremediation。"},{"word":"phytoremediation","ph":"/ˌfaɪtəʊrɪˌmiːdiˈeɪʃn/","df":"植物修复","ex":"Phytoremediation uses plants to absorb heavy metals from contaminated soil.","note":"利用植物去除环境中污染物的绿色修复技术","ex_cn":"植物修复利用植物从污染土壤中吸收重金属。","why":"表示“植物修复”，利用植物去除环境污染物；本句指用植物吸重金属，故选phytoremediation。"},{"word":"wastewater treatment","ph":"/ˈweɪstwɔːtə(r) ˈtriːtmənt/","df":"污水处理","ex":"Advanced wastewater treatment removes nutrients and emerging contaminants.","note":"去除废水中污染物的多级处理过程","ex_cn":"先进污水处理可去除营养物质和新兴污染物。","why":"表示“污水处理”，去除废水中污染物的多级处理过程；本句指处理废水，故选wastewater treatment。"},{"word":"microplastics","ph":"/ˈmaɪkrəʊˌplæstɪks/","df":"微塑料","ex":"Microplastics have been found in oceans, rivers, and even human blood.","note":"直径小于5毫米的塑料碎片","ex_cn":"微塑料已在水、河流甚至人体血液中被发现。","why":"表示“微塑料”，直径小于5毫米的塑料碎片；本句指环境里的小塑料颗粒，故选microplastics。"},{"word":"air pollution","ph":"/eə(r) pəˈluːʃn/","df":"空气污染","ex":"PM2.5 is the most concerning air pollutant nce ensures systems withstand and recover from disruptions.","note":"系统抵御和从冲击中恢复的能力","ex_cn":"工程韧性确保系统能抵御冲击并从中恢复。","why":"表示“韧性/恢复力”，系统抵御和从冲击中恢复的能力；本句指系统抗冲击恢复能力，故选resilience。"}]}];</script>

function todayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
// 基于日历日(UTC归一化)的天数差，避免本地时区毫秒偏移
function dayIndex(d){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function daysBetween(a,b){ return dayIndex(b)-dayIndex(a); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

// 当天主题：以起始日为 index0，每天后移一个主题，30 个循环
function todayThemeInfo(){
  var now = new Date();
  var idx = ((daysBetween(BASE_DATE, now) % THEMES.length)+THEMES.length)%THEMES.length;
  var dayNum = idx+1;
  return { idx:idx, dayNum:dayNum, theme:THEMES[idx], dateKey:todayKey(now) };
}

// 从主题生成题目：例句含词->挖空选词；不含->释义匹配
function buildQuestions(theme, count){
  var words = theme.words.slice(0, count);
  var qs = [];
  words.forEach(function(w){
    var stem = null, qtype;
    var ex = w.ex;
    if (ex && ex.toLowerCase().indexOf(w.word.toLowerCase()) !== -1) {
      qtype = 'fill';
      // 把原词（忽略大小写）挖空
      stem = ex.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), function(){ return '__BLANK__'; });
    } else {
      qtype = 'def';           // 释义匹配：给英文词选释义，或给释义选词
      var mode = Math.random() < 0.5 ? 'word2def' : 'def2word';
      qtype = mode;
    }
    qs.push({ word:w, ex:ex, qtype:qtype, stem:stem });
  });
  return qs;
}

// 生成选项：4个，含正确答案，其余从本主题其他词随机（保证都相近）
function makeOptions(theme, correctIdx, correctWord){
  var pool = theme.words.map(function(w,i){return {word:w.word, ph:w.ph, df:w.df, i:i};})
                .filter(function(x){return x.i!==correctIdx;});
  pool = shuffle(pool);
  var opts = pool.slice(0,3).map(function(x){return {word:x.word, ph:x.ph, df:x.df};});
  opts.push({word:correctWord.word, ph:correctWord.ph, df:correctWord.df});
  return shuffle(opts);
}

// ===== 错题记录管理 ====
function loadWrong(){ try{ return JSON.parse(localStorage.getItem(WRONG_KEY))||{}; }catch(e){ return {}; } }
function saveWrong(w){ localStorage.setItem(WRONG_KEY, JSON.stringify(w)); }
function loadDone(){ try{ return JSON.parse(localStorage.getItem(DONE_KEY))||{}; }catch(e){ return {}; } }
function saveDone(d){ localStorage.setItem(DONE_KEY, JSON.stringify(d)); }
// 错题 key 格式: "主题idx:indexinwords"
function wrongKey(ti, wi){ return ti+':'+wi; }

// ===== 渲染 =====
var state = { correctSel:{} }; // 每道题的正确答案选项index（用于判定）

function renderReview(){
  var w = loadWrong();
  var now = new Date();
  var nowKey = todayKey(now);
  var due = [];
  for (var k in w){ if (w.hasOwnProperty(k)){
    var parts = k.split(':');
    var ti = parseInt(parts[0]), wi = parseInt(parts[1]);
    var firstWrong = new Date(w[k]);
    var diff = daysBetween(firstWrong, now);
    if (diff >= 7){
      due.push({key:k, ti:ti, wi:wi, firstWrong:w[k], diff:diff});
    }
  }}
  var box = document.getElementById('reviewBox');
  if (due.length === 0){
    box.innerHTML = '<div class="review"><h2>🔁 错题复习</h2><div class="empty">暂无到期错题。今天或这7天内做错的题，7天后会自动到这里重新出现 ⏳</div></div>';
    return;
  }
  var html = '<div class="review"><h2>🔁 错题复习（7天到期 · '+due.length+'题）</h2><div class="cnt">以下题目已经过去7天，重新做一遍巩固：</div><div id="reviewQs"></div>';
  html += '<div class="btnrow"><button class="btn" onclick="submitReview()">提交复习</button></div><div id="reviewResult"></div></div>';
  box.innerHTML = html;
  var rc = document.getElementById('reviewQs');
  rc.innerHTML = '';
  // 渲染每题
  due.forEach(function(d){
    var theme = THEMES[d.ti];
    var wd = theme.words[d.wi];
    var opts = makeOptions(theme, d.wi, wd);
    // 记录正确选项
    var correctIdx = -1;
    for (var i=0;i<opts.length;i++) if (opts[i].word===wd.word) correctIdx=i;
    state['r_'+d.key] = correctIdx;
    var card = document.createElement('div');
    card.className='q'; card.dataset.key=d.key;
    var stem = wd.ex;
    var st = stem ? stem.replace(new RegExp(wd.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),function(){return '<span class="blank">______</span>';})
                   : '<span style="color:#7a4fd0">该词释义：</span>'+wd.df;
    var ohtml = '';
    opts.forEach(function(o,j){
      ohtml += '<button class="opt" data-val="'+o.word+'" onclick="revSel(this,\''+d.key+'\','+j+')"><span class="k">'+String.fromCharCode(65+j)+'</span>'+o.word+' <span style="color:#8a94ab">'+o.df+'</span></button>';
    });
    card.innerHTML = '<div class="qtype">🔁 错题复习 · '+wd.ph+'</div><div class="qstem">'+st+'</div>'+ohtml;
    rc.appendChild(card);
  });
}

function revSel(el, key, j){
  var q = el.closest('.q');
  if (q.classList.contains('locked')) return;
  q.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  el.classList.add('sel');
  q.dataset.sel = j;
}

function submitReview(){
  var w = loadWrong();
  var now = new Date();
  var nowKey = todayKey(now);
  var qs = document.querySelectorAll('#reviewQs .q');
  var score=0, total=qs.length;
  qs.forEach(function(q){
    var key = q.dataset.key;
    var correct = state['r_'+key];
    var sel = q.dataset.sel;
    q.classList.add('locked');
    var optEls = q.querySelectorAll('.opt');
    optEls.forEach(function(o,j){
      if (j===correct) o.classList.add('right');
      else if (String(j)===sel) o.classList.add('wrong');
    });
    // 反馈（详细解析：原句+译文+为什么选它+其他为什么不选）
    var theme = THEMES[parseInt(key.split(':')[0])];
    var wd = theme.words[parseInt(key.split(':')[1])];
    var optWords=[]; q.querySelectorAll('.opt').forEach(function(o){optWords.push(o.getAttribute('data-val'));});
    var ana = buildAnalysis(wd, optWords, theme.words);
    var fb = document.createElement('div');
    if (String(sel)===String(correct)){ score++; fb.className='fb ok'; fb.innerHTML='<b>✅ 答对：'+wd.word+'（'+wd.df+'）</b>'+ana;
      // 答对：从错题表删除
      delete w[key];
    } else { fb.className='fb no'; fb.innerHTML='<b>❌ 答错，正确：'+wd.word+'（'+wd.df+'）</b>'+ana+
      '<br><span style="color:#146a45;font-size:12px">7天后本词会再次出现在错题复习区。</span>';
      // 答错：重置日期为今天，7天后再来
      w[key] = nowKey;
    }
    q.appendChild(fb);
  });
  saveWrong(w);
  var rr = document.getElementById('reviewResult');
  rr.className='result '+(score===total?'good':'bad');
  rr.innerHTML = '<div class="big">'+score+' / '+total+'</div><div class="txt">'+ (score===total?'🎉 全部巩固完成，错题清理成功！':'仍需巩固 '+ (total-score) +' 题，7天后会自动再来。') +'</div>';
  // 刷新复习区（清空已删除的）
  setTimeout(function(){ renderReview(); }, 1800);
}

// ===== 详细解析构建 =====
function buildAnalysis(correctWord, optWords, themeWords){
  // optWords: 本题所有选项单词(含正确词) 按显示顺序
  function find(w){ for(var i=0;i<themeWords.length;i++) if(themeWords[i].word===w){ var o={word:w,df:themeWords[i].df,why:themeWords[i].why,note:themeWords[i].note}; return o; } return {word:w,df:'',why:'',note:''}; }
  var s='';
  // 原句 + 中文
  var ex = correctWord.ex || '';
  var exCn = correctWord.ex_cn || '';
  s += '<div class="ana-rect" style="margin-top:8px;padding:8px 10px;border-left:3px solid #22a06b;background:#f4fbf7;font-size:13px;line-height:1.7">';
  s += '<div><b>📖 原句：</b>'+ex+'</div>';
  if (exCn) s += '<div><b>🌐 中文：</b>'+exCn+'</div>';
  s += '</div>';
  // 正确答案为什么选它
  s += '<div style="margin-top:6px;font-size:13px;line-height:1.7"><b>✅ 为什么选「'+correctWord.word+'」：</b>'+(correctWord.why||correctWord.note||'')+'</div>';
  // 其他选项为什么不选
  var others = optWords.filter(function(w){ return w!==correctWord.word; });
  if (others.length){
    s += '<div style="margin-top:6px;font-size:13px;line-height:1.7"><b>🚫 其他选项为什么不选：</b><div style="margin-top:2px">';
    others.forEach(function(ow){
      var o = find(ow);
      s += '<div style="padding:3px 0;border-bottom:1px dashed #e0e7f4">· <b>'+o.word+'</b>（'+o.df+'）：'+(o.note||'')+'</div>';
    });
    s += '</div></div>';
  }
  return s;
}

// ===== 今日做题渲染 =====
function renderToday(){
  var info = todayThemeInfo();
  state = {};
  document.getElementById('todayInfo').textContent = '今天 '+info.dateKey+' · 第 '+info.dayNum+' 组相近词';
  document.getElementById('dayLabel').textContent = info.theme.theme + '（'+todayKey(new Date())+'）';
  var qs = buildQuestions(info.theme, 5);
  var box = document.getElementById('questions');
  box.innerHTML='';
  qs.forEach(function(q, qi){
    var opts = makeOptions(info.theme, qi, q.word);
    var correctIdx=-1;
    for(var i=0;i<opts.length;i++) if(opts[i].word===q.word.word) correctIdx=i;
    state[qi] = correctIdx;
    var card = document.createElement('div');
    card.className='q'; card.dataset.qi=qi;
    var st;
    if (q.qtype==='fill'){
      st = q.stem.replace('__BLANK__','<span class="blank">______</span>');
    } else {
      st = q.qtype==='def2word' ? '<span style="color:#2c5fd0">选出与释义对应的单词：</span><br>'+q.word.df
                                : '<span style="color:#2c5fd0">选出与「'+q.word.word+'」相符的释义：</span>';
    }
    var ohtml='';
    opts.forEach(function(o,j){
      var disp;
      if (q.qtype==='def2word') disp = o.word+' <span style="color:#8a94ab">'+o.ph+'</span>';
      else if (q.qtype==='word2def') disp = o.df;
      else disp = o.word+' <span style="color:#8a94ab">'+o.df+'</span>';
      ohtml += '<button class="opt" data-val="'+o.word+'" onclick="todaySel(this,'+qi+','+j+')"><span class="k">'+String.fromCharCode(65+j)+'</span>'+disp+'</button>';
    });
    var typeLabel = {'fill':'📝 选词填空','def2word':'🔤 释义→单词','word2def':'📖 单词→释义'}[q.qtype];
    card.innerHTML = '<div class="qtype">'+typeLabel+' · '+q.word.ph+'</div><div class="qstem">'+(st||'')+'</div>'+ohtml;
    box.appendChild(card);
  });
}

function todaySel(el, qi, j){
  var card = el.closest('.q');
  if (card.classList.contains('locked')) return;
  card.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  el.classList.add('sel');
  card.dataset.sel = j;
}

function submit(){
  var info = todayThemeInfo();
  var w = loadWrong();
  var done = loadDone();
  var qs = document.querySelectorAll('#questions .q');
  var score=0, total=qs.length;
  var answered=true;
  qs.forEach(function(q){
    if (q.dataset.sel===undefined) answered=false;
  });
  if(!answered){ alert('请先完成所有 5 道题再提交哦～'); return; }
  var allRight=true;
  qs.forEach(function(q){
    var qi = q.dataset.qi;
    var correct = state[qi];
    var sel = q.dataset.sel;
    q.classList.add('locked');
    q.querySelectorAll('.opt').forEach(function(o,j){
      if (j===correct) o.classList.add('right');
      else if (String(j)===sel) o.classList.add('wrong');
    });
    var theme = info.theme;
    var wd = theme.words[qi];
    var optWords=[]; q.querySelectorAll('.opt').forEach(function(o){optWords.push(o.getAttribute('data-val'));});
    var ana = buildAnalysis(wd, optWords, theme.words);
    var fb = document.createElement('div');
    if (String(sel)===String(correct)){ score++; fb.className='fb ok'; fb.innerHTML='<b>✅ 答对：'+wd.word+'（'+wd.df+'）</b>'+ana;
      // 若今天曾在错题表，答对可清掉
      var k = wrongKey(info.idx, qi);
      if (w[k]) { delete w[k]; }
    } else { allRight=false; fb.className='fb no'; fb.innerHTML='<b>❌ 答错，正确：'+wd.word+'（'+wd.df+'）</b>'+ana+
      '<br><span style="color:#146a45;font-size:12px">7天后本词会出现在错题复习区。</span>';
      // 记录错题（若已存在则保留原首次日期）
      var k = wrongKey(info.idx, qi);
      if (!w[k]) w[k] = todayKey(new Date());
    }
    q.appendChild(fb);
  });
  saveWrong(w);
  done[info.dateKey] = {score:score, total:total};
  saveDone(done);
  var r = document.getElementById('result');
  r.className='result '+(score===total?'good':'bad');
  var msg = score===total ? '🎉 满分！全部答对，今天的5词已掌握！' : (score>=4?'👍 很不错！只错 '+ (total-score) +' 题，7天后会再复习。':'💪 继续加油，错了 '+ (total-score) +' 题，7天后会再复习巩固。');
  r.innerHTML = '<div class="big">'+score+' / '+total+'</div><div class="txt">'+msg+'</div>';
}

function resetToday(){
  document.getElementById('questions').innerHTML='';
  document.getElementById('result').innerHTML='';
  renderToday();
}

// ===== 启动 =====
renderToday();
renderReview();
</script>
